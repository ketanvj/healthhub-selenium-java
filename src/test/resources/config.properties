# HealthHub training framework — environment configuration
# Override any of these with -D system properties, e.g. -Dbase.url=http://localhost:5173
# Defaults below point at the centrally hosted training instance — no
# local HealthHub setup needed. Override only if you're running your
# own local copy instead (e.g. -Dbase.url=http://localhost:5173).

base.url=https://healthhub.qualintia.com
api.base.url=https://healthhub.qualintia.com/api/v1
browser=chrome
headless=false
implicit.wait.seconds=2
explicit.wait.seconds=10

