# Prepares the GitHub Actions machine the Copilot coding agent works in.
# The job MUST be named copilot-setup-steps. Copilot runs it before every task;
# you can also run it from the Actions tab to check the setup works.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Optional overrides (e.g. -D values for test.user.*) can live in this environment
    environment: copilot

    steps:
      - uses: actions/checkout@v5

      # Java for the Selenium tests (pom.xml: maven.compiler.release 21).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ hashFiles('pom.xml') != '' && 'maven' || 'gradle' }}

      # Download dependencies now so the agent's first test run is fast
      - name: Resolve Maven dependencies
        if: hashFiles('pom.xml') != ''
        run: |
          if [ -x ./mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
          $MVN -q -B -DskipTests test-compile
      - name: Resolve Gradle dependencies
        if: hashFiles('pom.xml') == ''
        run: ./gradlew --no-daemon testClasses

      # Chrome + chromedriver for Selenium (Selenium Manager also finds this Chrome)
      - uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      # Node + Chromium for the Playwright browser server the agents explore with
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npx -y playwright install --with-deps chromium

      # The app under test is centrally hosted (https://healthhub.qualintia.com),
      # so there is nothing to start here. Add these hosts to the coding agent's
      # firewall allowlist (Settings → Copilot → Coding agent): healthhub.qualintia.com,
      # plus googlechromelabs.github.io, storage.googleapis.com and github.com for
      # WebDriverManager's driver downloads.
